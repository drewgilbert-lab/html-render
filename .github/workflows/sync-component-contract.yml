name: Sync component contract to geo-spoke-builder

# Ships html-render's component + Markdown contract to geo-spoke-builder, as a pull request
# that geo-spoke-builder's own CI gates and then merges on its own.
#
# This is the promotion step. `geo-spoke-builder/main` is the single production pointer for the
# design system: its contract names the exact html-render commit that belongs with it, and
# pillar-geo-launch resolves the pair from there. Nothing downstream is version-pinned by hand,
# so nothing downstream needs a person when a design change ships.
#
# What this workflow deliberately does NOT do:
#   - It does not edit any skill content in geo-spoke-builder.
#   - It does not open a PR when the generated contract matches what is already committed.
#   - It does not render, re-render or touch a single published page anywhere.
#
# It DOES set auto-merge. The review that matters happened on the html-render PR that produced
# this contract; asking for a second human review of a generated file, downstream, adds a
# waiting step and no judgement. geo-spoke-builder's required checks are the gate.
#
# See docs/component-sync.md for the maintainer's guide.

on:
  # Trigger on `main`, not on tags. A tag was only ever the sync trigger, and making a human cut
  # one put a manual step in front of every design change. The no-op path below is a byte
  # comparison, so a commit that does not move the contract costs one short run and opens nothing.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and diff, but do not push a branch or open a PR'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-component-contract
  cancel-in-progress: false

# The destination is repository configuration, not source: retargeting this
# workflow at a different consumer is a variables change, with no commit here.
# The token is still a hardcoded secret name — see docs/open-items.md.
env:
  TARGET_REPO: ${{ vars.SYNC_TARGET_REPO }}
  TARGET_PATH: ${{ vars.SYNC_TARGET_PATH }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 0. An unset variable would expand to an empty string, and checkout@v7 with an
      #    empty `repository` silently checks out THIS repo. Stop before that happens.
      - name: Check the sync target is configured
        run: |
          : "${TARGET_REPO:?repository variable SYNC_TARGET_REPO is not set — see docs/component-sync.md}"
          : "${TARGET_PATH:?repository variable SYNC_TARGET_PATH is not set — see docs/component-sync.md}"
          echo "Syncing to $TARGET_REPO :: $TARGET_PATH"

      # 1. html-render at the pushed commit (or the dispatched ref).
      #    fetch-depth: 0 — the PR body is built by reading CHANGELOG.md as it stood at the
      #    commit stamped in the previous contract file, which needs real history.
      - name: Check out html-render
        uses: actions/checkout@v7
        with:
          path: html-render
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The full SHA is the identity downstream resolves by; the short one is for prose.
      - name: Resolve version and commit
        id: source
        working-directory: html-render
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}" >> "$GITHUB_OUTPUT"

      # 2. Generate the contract from the live CLI. Its header carries the full renderer SHA and
      #    the design-export digest read from the committed lock file, so the generated bytes are
      #    a pure function of this commit — which is what makes step 4's no-op comparison valid.
      - name: Generate contract
        working-directory: html-render
        run: |
          node scripts/generate-contract.js --out "$GITHUB_WORKSPACE/contract.md"
          echo "--- generated header ---"
          head -20 "$GITHUB_WORKSPACE/contract.md"

      # 3. geo-spoke-builder's default branch, using the fine-grained PAT.
      - name: Check out geo-spoke-builder
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.GEO_SPOKE_BUILDER_SYNC_TOKEN }}
          path: geo-spoke-builder
          fetch-depth: 0

      # Read the stamp out of the file we are about to overwrite, BEFORE overwriting it.
      # That hash is what "which changelog entries are new" is measured from. The pattern
      # accepts 7 to 40 hex so a contract stamped before the full-SHA change still parses.
      - name: Read previous stamp
        id: previous
        working-directory: geo-spoke-builder
        run: |
          if [ -f "$TARGET_PATH" ]; then
            stamp=$(head -1 "$TARGET_PATH" | sed -n 's/.*html-render:contract .*commit=\([0-9a-f]\{7,40\}\).*/\1/p')
            echo "Previous contract stamped at commit: ${stamp:-<unparseable>}"
          else
            stamp=""
            echo "No previous contract file at $TARGET_PATH — first sync."
          fi
          echo "commit=$stamp" >> "$GITHUB_OUTPUT"

      # 4. Ship it. geo-spoke-builder owns how a contract is shipped into it — the plugin version
      #    rule and which line of its CLAUDE.md carries that version are its business, not this
      #    repo's — so this calls its script rather than editing three files from here.
      #
      #    A contract landing without a plugin version bump never reaches an installed session
      #    (geo-spoke-builder's check-contract-freshness.py), and a plugin version bump without
      #    the matching CLAUDE.md line fails its lint-skills.py. Either one leaves the PR red and
      #    auto-merge never fires, so all three move in one commit or the promotion does not
      #    happen at all.
      - name: Ship the contract into the plugin
        id: diff
        working-directory: geo-spoke-builder
        run: |
          set -euo pipefail
          python3 scripts/ship-contract.py \
            --contract "$GITHUB_WORKSPACE/contract.md" \
            --target "$TARGET_PATH" \
            --github-output "$GITHUB_OUTPUT"
          if [ "$(git status --porcelain | wc -l | tr -d ' ')" != "0" ]; then
            git --no-pager diff --stat
            git --no-pager diff > "$GITHUB_WORKSPACE/contract.diff" || true
            # A brand-new file shows up as untracked, not as a diff.
            if [ ! -s "$GITHUB_WORKSPACE/contract.diff" ]; then
              printf 'New file: %s (%s lines)\n' "$TARGET_PATH" "$(wc -l < "$TARGET_PATH" | tr -d " ")" > "$GITHUB_WORKSPACE/contract.diff"
            fi
          fi

      - name: No change, nothing to sync
        if: steps.diff.outputs.changed == 'false'
        run: |
          echo "no change, nothing to sync"
          echo "The contract generated from v${{ steps.source.outputs.version }} (\`${{ steps.source.outputs.commit }}\`) is byte-identical to what is already committed at \`$TARGET_PATH\`. No pull request opened." >> "$GITHUB_STEP_SUMMARY"

      # 5. Build the PR body: what we are syncing from, plus every changelog entry newer than the
      #    stamp we read in step 3, pasted verbatim (with the breaking-change flag prefixed).
      - name: Build pull request body
        if: steps.diff.outputs.changed == 'true'
        working-directory: html-render
        run: |
          {
            echo "Promotes \`$TARGET_PATH\` to **html-render v${{ steps.source.outputs.version }}**."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Renderer commit | \`${{ steps.source.outputs.commit }}\` |"
            echo "| Export digest | \`$(node scripts/export-lock.js --digest)\` |"
            echo "| Plugin version | \`${{ steps.diff.outputs.plugin_before }}\` → \`${{ steps.diff.outputs.plugin_after }}\` |"
            echo
            echo "Generated by \`scripts/generate-contract.js\` from the live renderer CLI, and shipped by"
            echo "\`scripts/ship-contract.py\` in this repository. Three files change: the contract, the plugin"
            echo "version, and the version string in \`CLAUDE.md\`. No skill content is touched."
            echo
            echo "**Set to auto-merge.** The renderer change was reviewed on its own html-render pull request;"
            echo "the required checks here are the gate on this one. Merging it moves the production pointer,"
            echo "so the next newly admitted \`pillar-geo-launch\` job resolves this builder commit and the exact"
            echo "renderer commit named above. No page is re-rendered and no existing page changes."
            echo
            echo "## Changelog since the last synced contract"
            echo
            node scripts/generate-contract.js --changelog-since "${{ steps.previous.outputs.commit }}"
          } > "$GITHUB_WORKSPACE/pr-body.md"
          cat "$GITHUB_WORKSPACE/pr-body.md"

      # 6. Dry run stops here, having shown exactly what it would have done.
      - name: Dry run — report and stop
        if: steps.diff.outputs.changed == 'true' && steps.source.outputs.dry_run == 'true'
        run: |
          echo "::notice::DRY RUN — no branch pushed, no pull request opened."
          {
            echo "# Dry run — nothing was pushed"
            echo
            echo "Would have opened a pull request into \`$TARGET_REPO\` from branch \`sync/html-render-v${{ steps.source.outputs.version }}\`, with auto-merge set."
            echo
            echo "## Pull request body would have been"
            echo
            cat "$GITHUB_WORKSPACE/pr-body.md"
            echo
            echo "## Diff would have been"
            echo
            echo '<details><summary>Show diff</summary>'
            echo
            # Five backticks: the contract file contains fences of its own (up to four,
            # since --components prints fenced block syntax), and a three-backtick wrapper
            # would be closed by the diff's own content.
            echo '`````diff'
            head -c 60000 "$GITHUB_WORKSPACE/contract.diff"
            echo '`````'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- pull request body ---"
          cat "$GITHUB_WORKSPACE/pr-body.md"
          echo "--- diff ---"
          cat "$GITHUB_WORKSPACE/contract.diff"

      # 7. Real run: branch, commit, push, open the PR, set auto-merge.
      - name: Open pull request
        id: pr
        if: steps.diff.outputs.changed == 'true' && steps.source.outputs.dry_run != 'true'
        working-directory: geo-spoke-builder
        env:
          GH_TOKEN: ${{ secrets.GEO_SPOKE_BUILDER_SYNC_TOKEN }}
          VERSION: v${{ steps.source.outputs.version }}
          PLUGIN_AFTER: ${{ steps.diff.outputs.plugin_after }}
        run: |
          set -euo pipefail
          BASE=$(git rev-parse --abbrev-ref HEAD)
          # Branch on the renderer version, not on the commit: a second commit to the same
          # renderer version updates the same PR instead of opening a second one.
          BRANCH="sync/html-render-$VERSION"

          git config user.name  "html-render sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch the sync branch explicitly if it already exists. Without this,
          # --force-with-lease has no lease to check against and refuses with "stale info"
          # on any re-run.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Ship the html-render $VERSION contract: plugin $PLUGIN_AFTER"
          # --force-with-lease, not --force: this branch is machine-owned and fully regenerated,
          # but the lease still refuses to clobber anything that arrived since we fetched.
          git push --force-with-lease origin "$BRANCH"

          # Re-running updates the existing PR rather than opening a duplicate.
          URL=$(gh pr list --repo "$TARGET_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$URL" ]; then
            echo "::notice::Updated existing pull request $URL"
          else
            URL=$(gh pr create \
              --repo "$TARGET_REPO" \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "Ship the html-render $VERSION contract: plugin $PLUGIN_AFTER" \
              --body-file "$GITHUB_WORKSPACE/pr-body.md")
            echo "::notice::Opened $URL"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Auto-merge, not merge: the PR lands only once geo-spoke-builder's required checks pass.
      # Those checks are what proves the pair — that the contract regenerates byte-identically
      # from the renderer commit it names, and that every component the skills ask for exists.
      #
      # This step fails the run if auto-merge cannot be set. A promotion that opened a PR nobody
      # will merge is not a promotion, and the whole point is that it never waits on a person.
      - name: Set auto-merge
        if: steps.diff.outputs.changed == 'true' && steps.source.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GEO_SPOKE_BUILDER_SYNC_TOKEN }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          if gh pr merge "$URL" --repo "$TARGET_REPO" --auto --squash --delete-branch; then
            echo "::notice::Auto-merge set on $URL"
            echo "Opened and set to auto-merge: $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not set auto-merge on $URL. Check that the repository has "\
              "'Allow auto-merge' enabled and that GEO_SPOKE_BUILDER_SYNC_TOKEN carries "\
              "Pull requests: read and write. The pull request is open and correct; it is "\
              "just waiting on a person, which is the thing this pipeline exists to avoid."
            echo "Opened $URL but could NOT set auto-merge — see the log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
